services:
  website:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD before starting}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET before starting}
    volumes:
      - site-data:/app/data

volumes:
  site-data:
